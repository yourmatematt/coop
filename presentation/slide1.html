<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* Mallacoota Beauty Pivot - Slide 1: Title Slide */
    :root {
      --ocean-blue: #003366;
      --pearl-white: #F8F8F8;
      --gold-accent: #D4AF37;
      --seafoam-green: #7FCDCD;
      --light-text: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .slide {
      width: 960px;
      height: 540px;
      position: relative;
      background: linear-gradient(135deg, var(--ocean-blue) 0%, #001a33 100%);
      overflow: hidden;
    }

    .ocean-wave {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 180px;
      background: linear-gradient(to bottom, transparent 0%, rgba(127, 205, 205, 0.2) 100%);
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      padding: 80px 60px;
      text-align: center;
    }

    .main-title {
      font-size: 56px;
      font-weight: 700;
      color: var(--light-text);
      margin: 0 0 20px 0;
      line-height: 1.2;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .gold-line {
      width: 200px;
      height: 4px;
      background: var(--gold-accent);
      margin: 0 auto 30px auto;
    }

    .subtitle {
      font-size: 28px;
      color: var(--seafoam-green);
      margin: 0 0 60px 0;
      font-weight: 300;
      line-height: 1.4;
    }

    .meta-info {
      font-size: 20px;
      color: var(--light-text);
      margin: 10px 0;
      font-weight: 300;
    }

    .company-name {
      font-size: 22px;
      color: var(--gold-accent);
      margin-top: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .accent-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--gold-accent);
      border-radius: 50%;
      margin: 0 12px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="ocean-wave"></div>
    <div class="content-wrapper">
      <h1 class="main-title">From Crisis to Opportunity:<br/>The Beauty Pivot</h1>
      <div class="gold-line"></div>
      <p class="subtitle">Repositioning Mallacoota Wild Abalone<br/>for Premium Markets</p>
      <div class="meta-info">November 2025</div>
      <p class="company-name">MALLACOOTA BLACK LIP ABALONE CO-OPERATIVE</p>
    </div>
  </div>

  <!-- Speaker Notes:
  Welcome to this strategic presentation on transforming our crisis into opportunity. Today we'll explore how repositioning our wild abalone from commodity food to premium beauty ingredient can secure the future of our 16 diving families. This is about survival and growth through smart, risk-managed innovation.
  -->
</body>
</html>
